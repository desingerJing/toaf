<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>海洋守護者 - 雲端版排行榜</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, query, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyCKTXCcneOdk0FrD0VlS21LXc9n_lj1YKQ",
            authDomain: "test-txt-131a7.firebaseapp.com",
            projectId: "test-txt-131a7",
            storageBucket: "test-txt-131a7.firebasestorage.app",
            messagingSenderId: "437774758491",
            appId: "1:437774758491:web:a9b0ec6741c7cf58bb857e",
            measurementId: "G-HVVRLVTKP0"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ocean-guardian-v1';

        window.gameCloud = {
            db, auth, appId, 
            currentUser: null,
            leaderboard: []
        };

        // 初始化驗證
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth Error:", error);
            }
        };
        initAuth();

        onAuthStateChanged(auth, (user) => {
            window.gameCloud.currentUser = user;
            if (user) {
                // 監聽公共排行榜資料
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard'));
                onSnapshot(q, (snapshot) => {
                    const data = [];
                    snapshot.forEach(doc => data.push(doc.data()));
                    // 在記憶體中排序並過濾出前 10 名
                    window.gameCloud.leaderboard = data.sort((a, b) => b.score - a.score).slice(0, 10);
                    if (typeof window.renderLeaderboard === 'function') {
                        window.renderLeaderboard(window.gameCloud.leaderboard);
                    }
                }, (err) => console.error("Snapshot error:", err));
            }
        });
    </script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        
        /* 修正手機板輸入框與捲軸觸控問題 */
        input, button { pointer-events: auto !important; }
        .scrollable-content { touch-action: pan-y !important; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="bg-gradient-to-b from-blue-100 to-blue-400 text-gray-800 select-none">
    
    <!-- UI 介面層 -->
    <div class="absolute inset-x-0 top-0 z-10 pointer-events-none p-3 lg:p-6">
        <div class="flex justify-between items-center w-full max-w-5xl mx-auto gap-4">
            <div class="bg-white/90 backdrop-blur rounded-xl px-4 py-1.5 shadow-lg flex flex-col items-center border border-blue-200 min-w-[70px]">
                <span class="text-[10px] font-bold text-blue-400 uppercase tracking-widest leading-none mb-1">SCORE</span>
                <span id="scoreDisplay" class="text-2xl font-black text-blue-600 leading-none">0</span>
            </div>
            <div class="flex flex-col items-end flex-1 max-w-[180px] md:max-w-[250px]">
                <span class="text-blue-900 font-bold text-[10px] md:text-sm mb-1 shadow-sm">海洋健康度</span>
                <div class="w-full h-4 md:h-6 bg-white/50 rounded-full border-2 border-blue-300 overflow-hidden shadow-inner backdrop-blur-sm">
                    <div id="healthBar" class="h-full bg-green-500 transition-all duration-300" style="width: 100%;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 選單與彈窗 -->
    <div id="startMenu" class="absolute inset-0 bg-blue-900/40 backdrop-blur-sm flex items-center justify-center z-30 transition-opacity duration-300 pointer-events-auto">
        <div class="bg-white/95 rounded-3xl p-6 md:p-8 w-11/12 max-w-md text-center shadow-2xl border border-white overflow-y-auto max-h-[90vh] custom-scrollbar scrollable-content">
            <div class="flex justify-center mb-2 md:mb-4">
                <img src="https://paymiou.github.io/paymiou/pic/ecobag.png" class="w-16 h-16 md:w-24 md:h-24 animate-bounce object-contain" alt="環保袋角色">
            </div>
            <h1 class="text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-teal-500 mb-1">海洋守護者</h1>
            <p class="text-gray-500 font-semibold mb-4 md:mb-6 text-sm md:text-base">攔截塑膠垃圾，守護純淨海洋</p>
            
            <div class="flex flex-col gap-2 md:gap-3 mb-4 md:mb-6">
                <button id="startBtn" class="w-full bg-gradient-to-r from-blue-500 to-teal-400 text-white font-black text-lg md:text-xl py-3 md:py-4 px-8 rounded-full shadow-lg hover:brightness-110 active:scale-95 transition-all">
                    開始淨海任務
                </button>
                <button id="viewLeaderboardBtn" class="w-full bg-white text-blue-600 border-2 border-blue-100 font-bold text-base md:text-lg py-2.5 md:py-3 px-8 rounded-full shadow hover:bg-blue-50 active:scale-95 transition-all">
                    🏆 查看排行榜
                </button>
            </div>

             <div class="bg-blue-50 rounded-xl p-3 md:p-4 text-left text-xs md:text-sm text-gray-700 space-y-2 md:space-y-3 font-medium border border-blue-100">
                <p class="flex items-center"><span class="text-xl mr-3">👈👉</span> 左右滑動移動角色</p>
                <p class="flex items-center text-green-700"><span class="text-xl mr-3">🧋</span> 攔截垃圾 <b>(+10分)</b></p>
                <p class="flex items-center text-red-600"><span class="text-xl mr-3">🐠</span> 撞到生物 <b>(-15健康)</b></p>
                <p class="flex items-center text-orange-600"><span class="text-xl mr-3">⚠️</span> 漏接垃圾 <b>(-5健康)</b></p>
            </div>
        </div>
    </div>

    <!-- 綜合彈窗 (任務結束 & 排行榜) -->
    <div id="gameOverMenu" class="absolute inset-0 bg-blue-900/80 backdrop-blur-md flex items-center justify-center z-40 hidden transition-opacity duration-300 pointer-events-auto">
        <div class="bg-white/95 rounded-3xl p-5 w-11/12 max-w-md text-center shadow-2xl border border-white relative overflow-hidden flex flex-col max-h-[95vh]">
            <!-- 關閉按鈕 -->
            <button id="closeMenuBtn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold p-2 text-xl leading-none z-50">✕</button>
            
            <div class="absolute top-0 left-0 w-full h-2 bg-blue-500" id="topBar"></div>
            
            <h2 id="menuTitle" class="text-2xl font-black text-gray-800 mb-1 mt-2">任務結束</h2>
            
            <div id="scoreArea" class="mb-4">
                <div id="rankTitleDisplay" class="text-sm font-bold text-teal-600 mb-1">獲得頭銜：尚未取得</div>
                <div id="finalScore" class="text-4xl font-black text-blue-600 leading-tight">0</div>
            </div>

            <div id="nameInputArea" class="hidden bg-yellow-50 rounded-2xl p-3 mb-4 border-2 border-yellow-200">
                <p id="saveHint" class="text-yellow-800 font-bold text-[10px] mb-2 uppercase tracking-wider">🎉 刷新紀錄！輸入守護者代號</p>
                <div class="flex gap-2">
                    <input type="text" id="playerNameInput" maxlength="10" placeholder="你的名稱..." class="flex-1 px-4 py-2 rounded-xl border border-yellow-300 focus:outline-none focus:ring-2 focus:ring-yellow-400 text-sm bg-white">
                    <button id="saveNameBtn" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold px-4 py-2 rounded-xl text-xs transition-colors active:scale-95">儲存</button>
                </div>
            </div>

            <div class="bg-blue-50/50 rounded-2xl p-3 mb-4 border border-blue-100 flex-1 overflow-hidden flex flex-col min-h-[220px]">
                <h3 class="text-sm font-bold text-blue-800 mb-2 flex items-center justify-center">
                    <span class="mr-2">🌍</span> 全球守護者前 10 名
                </h3>
                <!-- 排行榜捲動區域 -->
                <div id="leaderboardList" class="space-y-1 text-sm overflow-y-auto custom-scrollbar pr-1 flex-1 scrollable-content"></div>
            </div>

            <button id="restartBtn" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-black text-lg py-3 px-8 rounded-full shadow-lg transition-all active:scale-95">開始挑戰</button>
        </div>
    </div>

    <canvas id="gameCanvas" class="absolute inset-0 z-0 block w-full h-full"></canvas>

    <script type="module">
        import { doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const assets = {
            bottle: new Image(), straw: new Image(), bag: new Image(), player: new Image()
        };
        assets.bottle.src = 'https://paymiou.github.io/paymiou/pic/PETbottle.png';
        assets.straw.src = 'https://paymiou.github.io/paymiou/pic/straw.png';
        assets.bag.src = 'https://paymiou.github.io/paymiou/pic/bag.png';
        assets.player.src = 'https://paymiou.github.io/paymiou/pic/ecobag.png';

        let cw, ch, gameState = 'start', score = 0, health = 100, shakeAmount = 0, spawnTimer = 0, spawnRate = 60;
        let entities = [], particles = [], floatingTexts = [], bubbles = [];
        const player = { x: 0, y: 0, size: 85, targetX: 0, fallbackEmoji: '🛍️', floatTimer: 0 };

        function getRankTitle(s) {
            if (s >= 1500) return "🔱 海神守護者";
            if (s >= 1000) return "🐬 海洋大師";
            if (s >= 600)  return "🐢 資深潛水員";
            if (s >= 300)  return "🦀 海洋實習生";
            if (s >= 100)  return "🐟 淨海新手";
            return "🧹 海岸清道夫";
        }

        function resize() {
            cw = window.innerWidth; ch = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = cw * dpr; canvas.height = ch * dpr;
            ctx.scale(dpr, dpr);
            player.y = ch - 110;
            player.size = cw < 600 ? 75 : 90;
            if (gameState === 'start') { player.x = cw / 2; player.targetX = cw / 2; }
        }
        window.addEventListener('resize', resize);

        class Bubble { constructor() { this.reset(true); } reset(randomY = false) { this.x = Math.random() * cw; this.y = randomY ? Math.random() * ch : ch + 10; this.size = Math.random() * 5 + 2; this.speed = Math.random() * 1 + 0.5; this.oscillation = Math.random() * Math.PI * 2; } update() { this.y -= this.speed; this.oscillation += 0.02; if (this.y < -20) this.reset(); } draw(ctx) { ctx.beginPath(); ctx.arc(this.x + Math.sin(this.oscillation) * 5, this.y, this.size, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.fill(); } }
        class Entity { constructor(isTrash) { this.isTrash = isTrash; this.x = Math.random() * (cw - 100) + 50; this.y = -100; this.speed = 2.5 + Math.random() * 2 + (score * 0.02); if (isTrash) { const types = [{k:'bottle', f:'🍼', s:cw < 600 ? 80 : 100}, {k:'straw', f:'🥤', s:cw < 600 ? 55 : 70}, {k:'bag', f:'🛍️', s:cw < 600 ? 85 : 105}]; const c = types[Math.floor(Math.random() * types.length)]; this.imgKey = c.k; this.size = c.s + Math.random()*10; this.fallback = c.f; } else { this.emoji = ['🐟', '🐠', '🐡', '🐢', '🐙', '🦀', '🐬'][Math.floor(Math.random()*7)]; this.size = (cw < 600 ? 45 : 55) + Math.random()*15; } this.rotation = Math.random() * Math.PI * 2; this.rotSpeed = (Math.random() - 0.5) * 0.04; this.markedForDeletion = false; } update() { this.y += this.speed; this.rotation += this.rotSpeed; } draw(ctx) { ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation); if (this.isTrash && assets[this.imgKey].complete) { ctx.drawImage(assets[this.imgKey], -this.size/2, -this.size/2, this.size, this.size); } else { ctx.font = `${this.size}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(this.isTrash?this.fallback:this.emoji, 0, 0); } ctx.restore(); } }
        class Particle { constructor(x,y,c) { this.x=x; this.y=y; this.color=c; const a = Math.random()*Math.PI*2; const s = Math.random()*5+2; this.vx = Math.cos(a)*s; this.vy = Math.sin(a)*s; this.life = 1; this.size = Math.random()*4+2; } update() { this.x+=this.vx; this.y+=this.vy; this.life-=0.03; } draw(ctx) { ctx.save(); ctx.globalAlpha=this.life; ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); ctx.restore(); } }
        class FloatingText { constructor(t,x,y,c) { this.text=t; this.x=x; this.y=y; this.color=c; this.life=1; } update() { this.y-=1.5; this.life-=0.02; } draw(ctx) { ctx.save(); ctx.globalAlpha=this.life; ctx.fillStyle=this.color; ctx.font="bold 20px Arial"; ctx.textAlign='center'; ctx.fillText(this.text,this.x,this.y); ctx.restore(); } }

        window.renderLeaderboard = (lb) => {
            const listEl = document.getElementById('leaderboardList');
            if (!lb || lb.length === 0) { listEl.innerHTML = '<div class="text-gray-400 italic py-4 text-center">正在同步雲端資料...</div>'; return; }
            listEl.innerHTML = '';
            lb.forEach((item, i) => {
                const row = document.createElement('div');
                row.className = `flex justify-between items-center px-4 py-2 rounded-xl mb-1 bg-white/60 border border-blue-100 pointer-events-none`;
                const rankColors = ['text-yellow-500', 'text-gray-400', 'text-orange-400'];
                row.innerHTML = `
                    <div class="flex items-center gap-3 text-left">
                        <span class="font-black text-lg ${rankColors[i] || 'text-blue-300'}">#${i+1}</span>
                        <div class="flex flex-col">
                            <span class="font-bold text-gray-700 leading-none text-xs md:text-sm">${item.name}</span>
                            <span class="text-[10px] text-teal-600 font-semibold mt-1">${item.title || "海岸清道夫"}</span>
                        </div>
                    </div>
                    <span class="font-black text-blue-600 text-base md:text-lg">${item.score}</span>`;
                listEl.appendChild(row);
            });
        };

        const saveToCloud = async (name, s) => {
            const { db, appId, currentUser } = window.gameCloud;
            if (!currentUser || s <= 0) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', currentUser.uid);
                const existing = await getDoc(docRef);
                if (existing.exists() && existing.data().score >= s) return;

                await setDoc(docRef, {
                    name: name || "無名英雄",
                    score: s,
                    title: getRankTitle(s),
                    date: new Date().toLocaleDateString(),
                    uid: currentUser.uid
                });
            } catch (e) { console.error("雲端儲存失敗:", e); }
        };

        function updateUI() {
            document.getElementById('scoreDisplay').innerText = score;
            const hb = document.getElementById('healthBar');
            hb.style.width = `${Math.max(0, health)}%`;
            hb.style.backgroundColor = health > 60 ? '#22c55e' : (health > 30 ? '#eab308' : '#ef4444');
        }

        async function triggerGameOver(isReviewOnly = false) {
            gameState = isReviewOnly ? 'start' : 'gameover';
            const gameOverMenu = document.getElementById('gameOverMenu');
            gameOverMenu.classList.remove('hidden');
            
            const menuTitle = document.getElementById('menuTitle');
            const scoreArea = document.getElementById('scoreArea');
            const nameArea = document.getElementById('nameInputArea');
            const topBar = document.getElementById('topBar');
            const restartBtn = document.getElementById('restartBtn');

            if (isReviewOnly) {
                menuTitle.innerText = "守護者排行榜";
                scoreArea.classList.add('hidden');
                nameArea.classList.add('hidden');
                topBar.className = "absolute top-0 left-0 w-full h-2 bg-blue-500";
                restartBtn.innerText = "開始挑戰";
            } else {
                menuTitle.innerText = "任務結束";
                scoreArea.classList.remove('hidden');
                document.getElementById('finalScore').innerText = score;
                document.getElementById('rankTitleDisplay').innerText = `獲得頭銜：${getRankTitle(score)}`;
                topBar.className = "absolute top-0 left-0 w-full h-2 bg-red-500";
                restartBtn.innerText = "再試一次";

                const { db, appId, currentUser } = window.gameCloud;
                const lb = window.gameCloud.leaderboard;
                if (score > 0) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', currentUser.uid);
                    const existing = await getDoc(docRef);
                    const personalBest = existing.exists() ? existing.data().score : 0;
                    if (score > personalBest || lb.length < 10 || score > (lb[lb.length - 1]?.score || 0)) {
                        nameArea.classList.remove('hidden');
                        if (existing.exists()) {
                            document.getElementById('playerNameInput').value = existing.data().name;
                            document.getElementById('saveHint').innerText = "💪 刷新紀錄！更新代號？";
                        } else {
                            document.getElementById('saveHint').innerText = "🎉 留名青史！輸入守護者名稱：";
                        }
                    }
                }
            }
            window.renderLeaderboard(window.gameCloud.leaderboard);
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, cw, ch);
            ctx.save();
            if (shakeAmount > 0) { ctx.translate((Math.random()-0.5)*shakeAmount, (Math.random()-0.5)*shakeAmount); shakeAmount *= 0.9; }
            bubbles.forEach(b => { b.update(); b.draw(ctx); });

            if (gameState === 'playing') {
                player.x += (player.targetX - player.x) * 0.15;
                player.floatTimer += 0.06;
                const py = player.y + Math.sin(player.floatTimer) * 6;

                if (++spawnTimer >= spawnRate) {
                    spawnTimer = 0; spawnRate = Math.max(20, 60 - score * 0.1);
                    entities.push(new Entity(Math.random() > 0.45));
                }

                for (let i = entities.length - 1; i >= 0; i--) {
                    let e = entities[i]; e.update(); e.draw(ctx);
                    if (Math.hypot(player.x - e.x, py - e.y) < (player.size*0.4 + e.size*0.4)) {
                        e.markedForDeletion = true;
                        if (e.isTrash) {
                            score += 10; health = Math.min(100, health+2);
                            for(let j=0; j<8; j++) particles.push(new Particle(e.x, e.y, '#22c55e'));
                            floatingTexts.push(new FloatingText('+10', e.x, e.y, '#166534'));
                        } else {
                            score = Math.max(0, score-5); health -= 15; shakeAmount = 15;
                            for(let j=0; j<12; j++) particles.push(new Particle(e.x, e.y, '#ef4444'));
                            floatingTexts.push(new FloatingText('-15 健康', e.x, e.y, '#991b1b'));
                        }
                        updateUI();
                    } else if (e.y > ch + e.size) {
                        e.markedForDeletion = true;
                        if (e.isTrash) { health -= 5; shakeAmount = 8; updateUI(); }
                    }
                    if (e.markedForDeletion) entities.splice(i, 1);
                }
                if (health <= 0) triggerGameOver();
                ctx.save(); ctx.translate(player.x, py);
                if (assets.player.complete) { ctx.drawImage(assets.player, -player.size/2, -player.size/2, player.size, player.size); }
                ctx.restore();
            }
            particles.forEach((p, i) => { p.update(); p.draw(ctx); if (p.life <= 0) particles.splice(i, 1); });
            floatingTexts.forEach((t, i) => { t.update(); t.draw(ctx); if (t.life <= 0) floatingTexts.splice(i, 1); });
            ctx.restore();
        }

        const handleInput = (x) => { if (gameState === 'playing') player.targetX = x; };
        window.addEventListener('mousemove', (e) => handleInput(e.clientX));
        window.addEventListener('touchstart', (e) => handleInput(e.touches[0].clientX), {passive: true});
        window.addEventListener('touchmove', (e) => handleInput(e.touches[0].clientX), {passive: true});

        const startGame = () => {
            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameOverMenu').classList.add('hidden');
            score = 0; health = 100; entities = []; updateUI(); gameState = 'playing';
        };

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        document.getElementById('viewLeaderboardBtn').addEventListener('click', () => triggerGameOver(true));
        document.getElementById('closeMenuBtn').addEventListener('click', () => {
            document.getElementById('gameOverMenu').classList.add('hidden');
            gameState = 'start';
        });

        const performSave = async () => {
            const input = document.getElementById('playerNameInput');
            const name = input.value.trim();
            if (!name) return;
            await saveToCloud(name, score);
            document.getElementById('nameInputArea').classList.add('hidden');
        };

        document.getElementById('saveNameBtn').addEventListener('click', performSave);
        document.getElementById('playerNameInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') performSave(); });

        window.onload = () => { resize(); for(let i=0; i<20; i++) bubbles.push(new Bubble()); animate(); };
    </script>
</body>
</html>
