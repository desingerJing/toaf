<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拯救海龜：還海一片藍</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            overflow: hidden;
            background-color: #001d3d;
            color: white;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 29, 61, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1.5rem;
            opacity: 0;
            /* transition: opacity 0.6s ease, transform 0.6s ease; */
            transform: translateY(20px);
            pointer-events: none;
            backdrop-filter: blur(8px);
            z-index: -1;
        }

        .screen.active {
            opacity: 1;
            z-index: 20;
            transform: translateY(0);
            pointer-events: auto;
        }

        h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #4cc9f0; text-shadow: 0 0 15px rgba(76,201,240,0.5); }
        h2 { font-size: 1rem; font-weight: 300; margin-bottom: 1.5rem; color: #caf0f8; }

        .intel-list {
            text-align: left;
            background: rgba(255, 255, 255, 0.05);
            padding: 1.2rem;
            border-radius: 15px;
            border: 1px solid rgba(76, 201, 240, 0.3);
            margin-bottom: 1.5rem;
            max-width: 450px;
            width: 100%;
        }

        .intel-item { display: flex; align-items: flex-start; margin-bottom: 0.8rem; }
        .intel-icon { font-size: 1.2rem; margin-right: 12px; min-width: 25px; }
        .intel-content h3 { font-size: 0.95rem; color: #ffd166; margin-bottom: 2px; }
        .intel-content p { font-size: 0.8rem; opacity: 0.8; color: #e0fbfc; }

        .btn {
            background: linear-gradient(135deg, #4cc9f0 0%, #4361ee 100%);
            border: none;
            padding: 0.7rem 2rem;
            font-size: 1rem;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.4);
            transition: 0.2s;
        }

        .btn:active { transform: scale(0.95); }

        #hud {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: #caf0f8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
        }

        #progress-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 400px;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 5;
        }

        #progress-bar-bg { width: 100%; height: 10px; background: rgba(255, 255, 255, 0.2); border-radius: 10px; overflow: hidden; }
        #progress-bar-fill { height: 100%; width: 0%; background: #06d6a0; transition: width 0.3s; }
        
        /* 結束畫面樣式優化 */
        #rank-thanks { 
            font-size: 1.1rem; 
            margin-bottom: 0.5rem; 
            line-height: 1.4; 
            font-weight: 700; 
        }
        #rank-action {
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            background: rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 10px;
            color: #e0fbfc;
            max-width: 90%;
        }
        .rank-badge { font-size: 3.5rem; font-weight: bold; margin: 0; }
        .rank-name { font-size: 1rem; margin-bottom: 10px; letter-spacing: 1px; color: #4cc9f0; }
        
        /* 修改 score-board 使其在同一行呈現 */
        .score-board {
            background: rgba(255,255,255,0.08); 
            padding: 12px; 
            border-radius: 15px; 
            margin-bottom: 1.5rem; 
            width: 100%; 
            max-width: 350px; 
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .score-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .score-label {
            font-size: 0.7rem;
            opacity: 0.7;
            text-transform: uppercase;
        }
        .score-value {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .leaderboard-table th {
            background: rgba(255,255,255,0.1);
            padding: 8px 4px;
            color: #ffd166;
            font-weight: 600;
        }

        .leaderboard-table td {
            padding: 6px 4px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .leaderboard-table tr:nth-child(even) {
            background: rgba(255,255,255,0.05);
        }

        .rank-gold { color: #ffd700; }
        .rank-silver { color: #c0c0c0; }
        .rank-bronze { color: #cd7f32; }
        #leaderboard-screen h3+div {margin: 1.5rem 0;}
        .leaderboard-wrapper {
            width: 650px;
            max-width: 100%;
            margin: 0 auto;
            background: rgba(0, 29, 61, 0.85); /* 深色遮罩避免漏餡 */
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease forwards;
        }
        #join-modal[style="visibility: visible; opacity: 1;"] {
            position: fixed;      /* 固定在視窗上 */
            top: 0; left: 0;      /* 從最上方開始 */
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.6);
            z-index: 9999;        /* 確保在最上層 */
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
            transform: translateY(0);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="intro-screen" class="screen active">
            <h1>拯救海龜：還海一片藍</h1>
            <h2>你的一個小動作，海洋就能多呼吸一次</h2>
            <div style="margin: 1rem 0;">
                <p>海洋每天吞下無數塑膠...<br>生態系統正處於崩潰邊緣。</p>
            </div>
            <div style="display:flex; gap:10px;">
              <button class="btn" onclick="game.showIntel()">下 一 步</button>
              <button class="btn" onclick="game.showLeaderboard()">查看排行榜</button>
            </div>
        </div>

        <div id="intel-screen" class="screen">
            <h1>你的任務</h1>
            <div class="intel-list">
                <div class="intel-item">
                    <div class="intel-icon">♻️</div>
                    <div class="intel-content">
                        <h3>清除垃圾</h3>
                        <p>點擊漂浮的吸管、瓶罐、塑膠袋與殘破餐盒。</p>
                    </div>
                </div>
                <div class="intel-item">
                    <div class="intel-icon">🐢</div>
                    <div class="intel-content">
                        <h3>救援任務</h3>
                        <p>每清除垃圾滿 <span style="color:#ffd166">30 分</span>，就會出現一隻受困海龜。點擊即可解救！</p>
                    </div>
                </div>
                <div class="intel-item">
                    <div class="intel-icon">🪼</div>
                    <div class="intel-content">
                        <h3>小心水母！</h3>
                        <p>水母長得很像塑膠袋，點錯會扣分 (-2)。</p>
                    </div>
                </div>
            </div>
            <button class="btn" onclick="game.startGame()">開 始 任 務</button>
        </div>

        <div id="ending-screen" class="screen">
            <div id="rank-thanks">感謝詞載入中...</div>
            <div id="rank-badge" class="rank-badge">S</div>
            <div id="rank-name" class="rank-name">等級名稱</div>
            <div id="rank-action">實踐動作</div>

            <div class="score-board">
                <div class="score-item">
                    <span class="score-value">拯救海龜</span>
                    <span id="turtle-count" class="score-value text-4xl font-bold" style="color:#ffd166;">0</span>
                </div>
                <div style="width: 1px; height: 30px; background: rgba(255,255,255,0.1);"></div>
                <div class="score-item">
                    <span class="score-value">塑膠清除積分</span>
                    <span id="score-total" class="score-value text-4xl font-bold" style="color:#4cc9f0;">0</span>
                </div>
            </div>
            <div id="ending-buttons" style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn" id="btn-reset" onclick="game.reset()">再 次 行 動</button>
                <button class="btn" id="btn-join-leaderboard" onclick="game.openJoinModal()">加入排行榜</button>
            </div>
        </div>

        <div id="leaderboard-screen" class="screen">
            <div class="leaderboard-wrapper">
                <h3>排行榜</h3>
                <div class="leaderboard-wrapper">
                    <div id="leaderboard-list"></div>
                </div>
                <button class="btn" onclick="game.backToPreviousScreen()">返回</button>
            </div>
        </div>

        <div id="join-modal" class="screen">
            <h3>加入排行榜</h3>
            <p style="margin-bottom:10px;">
                你的分數：<span id="modal-score"></span>
            </p>

            <input id="player-name-input"
                type="text"
                maxlength="12"
                placeholder="請輸入勇者名字"
                style="
                    padding:10px;
                    border-radius:20px;
                    border:none;
                    width:200px;
                    text-align:center;
                    margin-bottom:15px;
                ">

            <div style="display:flex; gap:10px;">
                <button class="btn" onclick="game.submitLeaderboard()">送出</button>
                <button class="btn" onclick="game.closeJoinModal()">取消</button>
            </div>
        </div>
    </div>

    <div id="hud">
        <div class="hud-item">⏳ <span id="timer">01:00</span></div>
        <div class="hud-item">♻️ <span id="score">0</span></div>
    </div>

    <div id="progress-container">
        <div style="text-align:center; font-size:0.8rem; margin-bottom:5px; color:#caf0f8;">救援進度</div>
        <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
    </div>

<script>
// --- 音效系統 ---
const audio = {
    ctx: null,
    init() {
        if (this.ctx) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    },
    play(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        switch(type) {
            case 'pop':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(); osc.stop(now + 0.1);
                break;
            case 'save':
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.linearRampToValueAtTime(1000, now + 0.1);
                osc.frequency.linearRampToValueAtTime(1200, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(); osc.stop(now + 0.3);
                break;
            case 'wrong':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(); osc.stop(now + 0.2);
                break;
            case 'fanfare':
                osc.type = 'square';
                [440, 554, 659].forEach((f, i) => {
                    const o = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    o.type = 'sine'; o.frequency.value = f;
                    o.connect(g); g.connect(this.ctx.destination);
                    g.gain.setValueAtTime(0, now);
                    g.gain.linearRampToValueAtTime(0.1, now + i * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    o.start(); o.stop(now + 0.6);
                });
                break;
        }
    }
};

const utils = {
    randomRange: (min, max) => Math.random() * (max - min) + min,
    randomInt: (min, max) => Math.floor(Math.random() * (max - min + 1) + min)
};

// --- 視覺組件 ---
class Bubble {
    constructor() { this.reset(); this.y = Math.random() * window.innerHeight; }
    reset() {
        this.x = Math.random() * window.innerWidth;
        this.y = window.innerHeight + 20;
        this.size = utils.randomRange(2, 6);
        this.speed = utils.randomRange(0.5, 1.5);
        this.opacity = utils.randomRange(0.1, 0.4);
    }
    update() {
        this.y -= this.speed;
        this.x += Math.sin(this.y / 30) * 0.5;
        if (this.y < -20) this.reset();
    }
    draw(ctx) {
        ctx.save(); ctx.globalAlpha = this.opacity; ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
}

class Seaweed {
    constructor(x) {
        this.x = x; this.y = window.innerHeight;
        this.height = utils.randomRange(60, 150);
        this.offset = Math.random() * Math.PI * 2;
        this.segments = 6;
        this.width = utils.randomRange(4, 8);
    }
    draw(ctx) {
        ctx.save(); ctx.strokeStyle = '#2d6a4f'; ctx.lineWidth = this.width; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(this.x, this.y);
        for(let i = 1; i <= this.segments; i++) {
            const segmentY = this.y - (this.height / this.segments) * i;
            const sway = Math.sin(Date.now() / 1000 + this.offset + i * 0.3) * (i * 2.5);
            ctx.lineTo(this.x + sway, segmentY);
        }
        ctx.stroke(); ctx.restore();
    }
}

class Particle {
    constructor(x, y, color = 'white') { this.x = x; this.y = y; this.vx = utils.randomRange(-1, 1); this.vy = utils.randomRange(-1, -2); this.life = 100; this.color = color; }
    update() { this.x += this.vx; this.y += this.vy; this.life -= 4; }
    draw(ctx) { ctx.save(); ctx.globalAlpha = this.life/100; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI*2); ctx.fill(); ctx.restore(); }
}

class FloatingText {
    constructor(x, y, text, color = 'white') { this.x = x; this.y = y; this.text = text; this.life = 100; this.color = color; }
    update() { this.y -= 0.8; this.life -= 1.5; }
    draw(ctx) { ctx.save(); ctx.globalAlpha = this.life/100; ctx.fillStyle = this.color; ctx.font = "bold 18px 'Noto Sans TC'"; ctx.textAlign = "center"; ctx.fillText(this.text, this.x, this.y); ctx.restore(); }
}

// --- 遊戲實體 ---
class Jellyfish {
    constructor(x, y) {
        this.x = x; this.y = y; this.type = 'jellyfish';
        this.rotation = Math.random() * Math.PI * 2;
        this.driftX = Math.random() * Math.PI * 2;
        this.pulse = 0;
    }
    update() {
        this.x += Math.sin(Date.now() / 2000 + this.driftX) * 0.4;
        this.y += Math.cos(Date.now() / 2500) * 0.2;
        this.pulse = Math.sin(Date.now() / 500) * 5;
    }
    draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
        ctx.fillStyle = 'rgba(200, 220, 255, 0.35)';
        ctx.beginPath(); ctx.arc(0, 0, 15 + this.pulse/2, Math.PI, 0); ctx.fill();
        ctx.strokeStyle = 'rgba(200, 220, 255, 0.2)'; ctx.lineWidth = 2;
        for(let i = -10; i <= 10; i+=5) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.quadraticCurveTo(i + Math.sin(Date.now()/300)*5, 10, i, 22); ctx.stroke();
        }
        ctx.restore();
    }
}

class Trash {
    constructor(x, y, type) {
        this.x = x; this.y = y; this.type = type;
        this.rotation = Math.random() * Math.PI * 2;
        this.driftX = Math.random() * Math.PI * 2;
        this.rotSpeed = utils.randomRange(-0.01, 0.01);
    }
    update() {
        this.x += Math.sin(Date.now() / 2000 + this.driftX) * 0.3;
        this.y += Math.cos(Date.now() / 2500) * 0.3;
        this.rotation += this.rotSpeed;
    }
    draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
        switch(this.type) {
            case 'bottle':
                ctx.fillStyle = 'rgba(180, 220, 255, 0.5)'; ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath(); ctx.roundRect(-10, -15, 20, 30, 4); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#4361ee'; ctx.fillRect(-5, -20, 10, 5);
                break;
            case 'straw':
                ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 4; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(-15, -10); ctx.lineTo(15, 10); ctx.stroke();
                break;
            case 'bag':
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'; ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath(); ctx.moveTo(-15, -10); ctx.bezierCurveTo(-20, 20, 20, 20, 15, -10);
                ctx.moveTo(-15, -10); ctx.quadraticCurveTo(-15, -25, -5, -10); 
                ctx.moveTo(15, -10); ctx.quadraticCurveTo(15, -25, 5, -10); 
                ctx.fill(); ctx.stroke();
                break;
            case 'box':
                ctx.fillStyle = 'rgba(240, 240, 240, 0.7)'; ctx.strokeStyle = 'rgba(120, 120, 120, 0.4)';
                ctx.beginPath(); ctx.moveTo(-15, -10); ctx.lineTo(15, -12); ctx.lineTo(18, 10); ctx.lineTo(-12, 15); ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.fillStyle = 'rgba(100, 50, 0, 0.1)'; ctx.beginPath(); ctx.arc(5, 5, 4, 0, Math.PI*2); ctx.fill();
                break;
        }
        ctx.restore();
    }
}

class SeaTurtle {
    constructor(x, y) {
        this.x = x; this.y = y; this.state = 'TRAPPED';
        this.angle = Math.random() * Math.PI * 2;
        this.opacity = 1;
    }
    update() {
        if (this.state === 'LEAVING') {
            this.x += Math.cos(this.angle) * 3; this.y += Math.sin(this.angle) * 3;
            this.opacity -= 0.02; return this.opacity <= 0;
        }
        return false;
    }
    draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.state === 'TRAPPED' ? '#2d6a4f' : '#70e000';
        [[-22, -15], [22, -15], [-22, 15], [22, 15]].forEach(p => {
            ctx.beginPath(); ctx.ellipse(p[0], p[1], 10, 7, p[0]*p[1]>0?0.5:-0.5, 0, Math.PI*2); ctx.fill();
        });
        ctx.fillStyle = this.state === 'TRAPPED' ? '#1b4332' : '#38b000';
        ctx.beginPath(); ctx.ellipse(0, 0, 28, 22, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = this.state === 'TRAPPED' ? '#2d6a4f' : '#70e000';
        ctx.beginPath(); ctx.arc(32, 0, 10, 0, Math.PI*2); ctx.fill();
        if (this.state === 'TRAPPED') {
            ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1.5;
            for(let i=-30; i<=30; i+=10) {
                ctx.beginPath(); ctx.moveTo(i, -25); ctx.lineTo(i, 25); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-35, i); ctx.lineTo(35, i); ctx.stroke();
            }
        }
        ctx.restore();
    }
}

// --- 核心引擎 ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const game = {
    state: 'INTRO', timer: 60, score: 0, turtlesSaved: 0,
    entities: { trash: [], jellyfish: [], turtle: null, particles: [], texts: [], bubbles: [], seaweed: [] },
    previousScreen: null,

    init() {
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; this.setupSeaweed(); });
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        ['mousedown', 'touchstart'].forEach(e => canvas.addEventListener(e, (ev) => {
            audio.init(); 
            this.handleInput(ev);
        }));
        
        for(let i=0; i<30; i++) this.entities.bubbles.push(new Bubble());
        this.setupSeaweed();
        this.setupLevel();
        this.loop();
    },

    setupSeaweed() {
        this.entities.seaweed = [];
        const count = Math.floor(canvas.width / 80);
        for(let i=0; i<count; i++) this.entities.seaweed.push(new Seaweed(i * 80 + utils.randomRange(0, 40)));
    },

    setupLevel() {
        this.entities.trash = []; this.entities.jellyfish = []; this.entities.turtle = null;
        this.entities.particles = []; this.entities.texts = [];
        this.spawnTrash(15); this.spawnJellyfish(5);
    },

    spawnTrash(n) {
        const types = ['bottle', 'straw', 'bag', 'box'];
        for(let i=0; i<n; i++) this.entities.trash.push(new Trash(Math.random()*canvas.width, Math.random()*(canvas.height-120), types[utils.randomInt(0,3)]));
    },

    spawnJellyfish(n) {
        for(let i=0; i<n; i++) this.entities.jellyfish.push(new Jellyfish(Math.random()*canvas.width, Math.random()*(canvas.height-120)));
    },

    showIntel() {
        document.getElementById('intro-screen').classList.remove('active');
        document.getElementById('intel-screen').classList.add('active');
    },

    startGame() {
        document.getElementById('intel-screen').classList.remove('active');
        document.getElementById('hud').style.opacity = 1;
        document.getElementById('progress-container').style.opacity = 1;
        this.state = 'PLAYING';
        // this.score = 0; this.timer = 5; this.turtlesSaved = 0;
        this.score = 0; this.timer = 60; this.turtlesSaved = 0;
        this.updateHUD();
        if(this.timerInterval) clearInterval(this.timerInterval);
        this.timerInterval = setInterval(() => {
            if(this.state !== 'PLAYING') return;
            this.timer--; this.updateHUD();
            if(this.timer <= 0) this.endGame();
        }, 1000);
    },

    endGame() {
        this.state = 'ENDING';
        audio.play('fanfare');
        
        let rank = 'C', rankName = '', thanksText = '', actionText = '', rankColor = '';

        if (this.turtlesSaved >= 10) {
            rank = 'S'; rankName = '海洋希望之光'; 
            thanksText = '海面上有光，是因為有你在乎。'; 
            actionText = '✨帶著你的光，召集更多的勇士吧！ ✨';
            rankColor = '#ffd166';
        } else if (this.turtlesSaved >= 7) {
            rank = 'A'; rankName = '海龜守護者'; 
            thanksText = '守護不需要很偉大，只需要更多願意的人。'; 
            actionText = '帶上環保餐盒，把守護更擴大 🍱🍴';
            rankColor = '#06d6a0';
        } else if (this.turtlesSaved >= 4) {
            rank = 'B'; rankName = '海洋同行者'; 
            thanksText = '你不是旁觀者，你正在參與改變。'; 
            actionText = '自備餐具，讓減塑變成日常 🍴🛍️';
            rankColor = '#4cc9f0';
        } else {
            rank = 'C'; rankName = '守護初心者'; 
            thanksText = '願意開始的人，就是守護者。'; 
            actionText = '購物記得帶上自己的袋子 🛍️🐢';
            rankColor = '#caf0f8';
        }

        const thanksEl = document.getElementById('rank-thanks');
        thanksEl.innerText = thanksText;
        thanksEl.style.color = rankColor;

        const badgeEl = document.getElementById('rank-badge');
        badgeEl.innerText = rank;
        badgeEl.style.color = rankColor;
        badgeEl.style.textShadow = `0 0 20px ${rankColor}88`;

        document.getElementById('rank-name').innerText = `等級：${rankName}`;
        document.getElementById('rank-action').innerText = actionText;
        document.getElementById('turtle-count').innerText = this.turtlesSaved;
        document.getElementById('score-total').innerText = this.score;
        
        document.getElementById('hud').style.opacity = 0;
        document.getElementById('progress-container').style.opacity = 0;
        document.getElementById('ending-screen').classList.add('active');
    },

    reset() {
        document.getElementById('ending-screen').classList.remove('active');
        document.getElementById('intro-screen').classList.add('active');
        this.setupLevel();
        this.state = 'INTRO';
    },

    handleInput(e) {
        if(this.state !== 'PLAYING') return;
        const pos = e.touches ? e.touches[0] : e;
        const rect = canvas.getBoundingClientRect();
        const x = pos.clientX - rect.left, y = pos.clientY - rect.top;

        if (this.entities.turtle && this.entities.turtle.state === 'TRAPPED') {
            const d = Math.sqrt((this.entities.turtle.x-x)**2 + (this.entities.turtle.y-y)**2);
            if (d < 50) {
                audio.play('save');
                this.entities.turtle.state = 'LEAVING';
                this.turtlesSaved++;
                this.entities.texts.push(new FloatingText(x, y, "救援成功！", "#06d6a0"));
                this.updateHUD();
                return;
            }
        }

        for(let i=this.entities.trash.length-1; i>=0; i--) {
            const t = this.entities.trash[i];
            if(Math.sqrt((t.x-x)**2 + (t.y-y)**2) < 40) {
                audio.play('pop');
                this.entities.trash.splice(i, 1);
                this.score++;
                this.entities.texts.push(new FloatingText(x, y, "+1"));
                for(let j=0; j<5; j++) this.entities.particles.push(new Particle(x,y));
                if(this.entities.trash.length < 10) this.spawnTrash(5);
                if (this.score > 0 && this.score % 30 === 0 && !this.entities.turtle) {
                    this.entities.turtle = new SeaTurtle(canvas.width/2, canvas.height/2);
                }
                this.updateHUD();
                return;
            }
        }

        for(let i=this.entities.jellyfish.length-1; i>=0; i--) {
            const j = this.entities.jellyfish[i];
            if(Math.sqrt((j.x-x)**2 + (j.y-y)**2) < 40) {
                audio.play('wrong');
                this.score = Math.max(0, this.score - 2);
                this.entities.texts.push(new FloatingText(x, y, "這是水母！-2", "#ff8a8a"));
                this.updateHUD();
                return;
            }
        }
    },

    updateHUD() {
        document.getElementById('timer').innerText = `00:${this.timer.toString().padStart(2,'0')}`;
        document.getElementById('score').innerText = this.score;
        const progress = (this.score % 30) / 30 * 100;
        const bar = document.getElementById('progress-bar-fill');
        bar.style.width = this.entities.turtle ? '100%' : `${progress}%`;
        bar.style.background = this.entities.turtle ? '#ef476f' : '#06d6a0';
    },

    drawOcean(ctx) {
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#00b4db'); grad.addColorStop(1, '#001d3d');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
    },

    loop() {
        this.drawOcean(ctx);
        this.entities.seaweed.forEach(s => s.draw(ctx));
        this.entities.bubbles.forEach(b => { b.update(); b.draw(ctx); });
        if (this.entities.turtle) {
            if (this.entities.turtle.update()) this.entities.turtle = null;
            else this.entities.turtle.draw(ctx);
        }
        this.entities.trash.forEach(t => { t.update(); t.draw(ctx); });
        this.entities.jellyfish.forEach(j => { j.update(); j.draw(ctx); });
        this.entities.particles = this.entities.particles.filter(p => p.life > 0);
        this.entities.particles.forEach(p => { p.update(); p.draw(ctx); });
        this.entities.texts = this.entities.texts.filter(t => t.life > 0);
        this.entities.texts.forEach(t => { t.update(); t.draw(ctx); });
        requestAnimationFrame(() => this.loop());
    },

    async showLeaderboard(extraPlayer = null) {

        // 記錄目前 active 的畫面
        const activeScreen = document.querySelector('.screen.active');
        if(activeScreen && activeScreen.id !== 'leaderboard-screen') {
            this.previousScreen = activeScreen.id;
        }

        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('leaderboard-screen').classList.add('active');

        const wrapper = document.querySelector('.leaderboard-wrapper');
        wrapper.classList.remove('fade-in-up');
        void wrapper.offsetWidth; // 重新觸發
        wrapper.classList.add('fade-in-up');

        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('leaderboard-screen').classList.add('active');

        const listEl = document.getElementById('leaderboard-list');
        listEl.innerHTML = "載入中...";

        const q = fb.query(
            fb.collection(db, "saving-sea-turtles"),
            fb.orderBy("score", "desc"),
            fb.limit(10)
        );

        const snapshot = await fb.getDocs(q);

        let html = `
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>名次</th>
                        <th>勇者名字</th>
                        <th>等級</th>
                        <th>拯救海龜</th>
                        <th>分數</th>
                    </tr>
                </thead>
                <tbody>
        `;

        let rank = 1;

        snapshot.forEach(doc => {
            const data = doc.data();

            let rankDisplay = rank;
            let rankClass = "";

            if (rank === 1) {
                rankDisplay = "🥇";
                rankClass = "rank-gold";
            } else if (rank === 2) {
                rankDisplay = "🥈";
                rankClass = "rank-silver";
            } else if (rank === 3) {
                rankDisplay = "🥉";
                rankClass = "rank-bronze";
            }

            html += `
                <tr>
                    <td class="${rankClass}">${rankDisplay}</td>
                    <td>${data.name}</td>
                    <td>${data.rank}</td>
                    <td>${data.turtles || 0}</td>
                    <td>${data.score}</td>
                </tr>
            `;

            rank++;
        });

        html += `</tbody></table>`;

        // 如果玩家不在前10
        if (extraPlayer && extraPlayer.rank > 10) {
            html += `
                <div style="margin-top:15px;color:#ffd166;font-size:0.9rem;">
                    10+　${extraPlayer.name}　${extraPlayer.score}
                </div>
            `;
        }

        listEl.innerHTML = html;
    },

    backToPreviousScreen() {
        // 隱藏排行榜 screen
        document.getElementById('leaderboard-screen').classList.remove('active');

        // 移除 fade-in-up class
        const wrapper = document.querySelector('.leaderboard-wrapper');
        wrapper.classList.remove('fade-in-up');

        // 回到前一個畫面
        if (this.previousScreen) {
            document.getElementById(this.previousScreen).classList.add('active');
        } else {
            // 沒有紀錄的話預設回首頁
            document.getElementById('intro-screen').classList.add('active');
        }

        this.previousScreen = null; // 清空紀錄
    },

    async saveScore(name, rankName) {

        await fb.addDoc(
            fb.collection(db, "saving-sea-turtles"),
            {
                name: name,
                score: this.score,
                rank: rankName,
                turtles: this.turtlesSaved,
                createdAt: Date.now()
            }
        );

        // 重新抓排行榜並計算名次
        const q = fb.query(
            fb.collection(db, "saving-sea-turtles"),
            fb.orderBy("score", "desc")
        );

        const snapshot = await fb.getDocs(q);

        let position = 1;
        let playerRank = null;

        snapshot.forEach(doc => {
            if(doc.data().name === name && doc.data().score === this.score){
                playerRank = position;
            }
            position++;
        });

        this.showLeaderboard({
            name: name,
            score: this.score,
            rank: playerRank
        });
    },

    openJoinModal() {
        if (this.score <= 0) {
            const input = document.getElementById("player-name-input");
            input.value = "";
            input.placeholder = "沒有分數無法加入排行榜";
            input.focus();
            return;
        }

        document.getElementById("modal-score").innerText = this.score;
        document.getElementById("player-name-input").value = "";

        const modal = document.getElementById("join-modal");
        modal.style.visibility = "visible";
        modal.style.opacity = "1";
    },

    closeJoinModal() {
        const modal = document.getElementById("join-modal");
        modal.style.opacity = "0";
        setTimeout(()=> modal.style.visibility="hidden", 300);
    },

    async submitLeaderboard() {
        const name = document.getElementById("player-name-input").value.trim();

        if (!name) {
            document.getElementById("player-name-input").placeholder = "請輸入名字！";
            document.getElementById("player-name-input").focus();
            return;
        }

        await fb.addDoc(
            fb.collection(db, "saving-sea-turtles"),
            {
                name: name,
                score: this.score,
                rank: document.getElementById('rank-badge').innerText.replace("等級：",""),
                turtles: this.turtlesSaved,
                createdAt: Date.now()
            }
        );

        this.closeJoinModal();  // 送出後關閉 modal
        this.showLeaderboardFromEnding(); // 顯示排行榜
    },

    async showLeaderboardFromEnding() {
        // 記錄回來要回到的畫面為 ending
        this.previousScreen = 'ending-screen';

        const wrapper = document.querySelector('.leaderboard-wrapper');
        wrapper.classList.remove('fade-in-up');
        void wrapper.offsetWidth;
        wrapper.classList.add('fade-in-up');

        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('leaderboard-screen').classList.add('active');

        // 載入排行榜資料
        const listEl = document.getElementById('leaderboard-list');
        listEl.innerHTML = "載入中...";

        const q = fb.query(
            fb.collection(db, "saving-sea-turtles"),
            fb.orderBy("score","desc"),
            fb.limit(10)
        );
        const snapshot = await fb.getDocs(q);

        let html = `<table class="leaderboard-table">
            <thead>
                <tr>
                    <th>名次</th><th>勇者名字</th><th>等級</th><th>拯救海龜</th><th>分數</th>
                </tr>
            </thead><tbody>`;

        let rank=1;
        snapshot.forEach(doc=>{
            const data = doc.data();
            let rankDisplay = rank;
            let rankClass = "";
            if(rank===1){ rankDisplay="👑"; rankClass="rank-gold"; }
            else if(rank===2){ rankDisplay="👑"; rankClass="rank-silver"; }
            else if(rank===3){ rankDisplay="👑"; rankClass="rank-bronze"; }

            html += `<tr>
                <td class="${rankClass}">${rankDisplay}</td>
                <td>${data.name}</td>
                <td>${data.rank}</td>
                <td>${data.turtles || 0}</td>
                <td>${data.score}</td>
            </tr>`;
            rank++;
        });
        html += `</tbody></table>`;
        listEl.innerHTML = html;

        // 將「再次行動」旁按鈕文字改成「查看排行榜」
        const joinBtn = document.getElementById("btn-join-leaderboard");
        joinBtn.innerText = "查看排行榜";
        joinBtn.onclick = ()=> this.showLeaderboardFromEnding();
    }
};

window.onload = () => game.init();
</script>
