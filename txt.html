<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>環保杯互動文字雲測試</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect } = React;
    const { createRoot } = ReactDOM;

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase config 請改成你自己的
    const firebaseConfig = {
            apiKey: "AIzaSyCKTXCcneOdk0FrD0VlS21LXc9n_lj1YKQ",
            authDomain: "test-txt-131a7.firebaseapp.com",
            projectId: "test-txt-131a7",
            storageBucket: "test-txt-131a7.firebasestorage.app",
            messagingSenderId: "437774758491",
            appId: "1:437774758491:web:a9b0ec6741c7cf58bb857e",
            measurementId: "G-HVVRLVTKP0"
        };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    function WordCloudDisplay({ data }) {
      if (!data.length) return (
        <div className="h-64 flex flex-col items-center justify-center text-slate-400 border-2 border-dashed border-slate-200 rounded-xl bg-slate-50/50">
          <p>目前還沒有資料，快來填寫！</p>
        </div>
      );

      // 計算文字頻率
      const frequencyMap = {};
      data.forEach(text => {
        const clean = text?.trim();
        if (clean) frequencyMap[clean] = (frequencyMap[clean] || 0) + 1;
      });

      const tags = Object.entries(frequencyMap).map(([text, count]) => {
        const size = 1 + Math.min(count, 10) * 0.3; // 字體大小 1rem 起跳，最大約 4rem
        return (
          <span
            key={text}
            className="font-bold text-emerald-700 m-1 cursor-pointer hover:scale-110 transition-transform"
            style={{ fontSize: `${size}rem`, opacity: 0.7 + Math.min(count, 10) * 0.03 }}
            title={`出現 ${count} 次`}
          >
            {text}
          </span>
        );
      });

      return (
        <div className="flex flex-wrap justify-center items-center p-6 bg-white rounded-xl shadow-inner min-h-[12rem]">
          {tags}
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [responses, setResponses] = useState([]);
      const [input, setInput] = useState("");
      const [status, setStatus] = useState({ type: "", text: "" });
      const [isSubmitting, setIsSubmitting] = useState(false);

      const finalAppId = "eco-cloud-app";

      // 匿名登入
      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, async (u) => {
          if (!u) {
            try {
              await signInAnonymously(auth);
            } catch (err) {
              setStatus({ type: "error", text: "驗證失敗：" + err.message });
              setLoading(false);
            }
          } else {
            setUser(u);
            setLoading(false);
          }
        });
        return () => unsubscribe();
      }, []);

      // 監聽 responses collection 即時更新
      useEffect(() => {
        if (!user) return;

        const collRef = collection(db, 'artifacts', finalAppId, 'public', 'data', 'responses');
        const unsubscribe = onSnapshot(collRef, (snapshot) => {
          setResponses(snapshot.docs.map(doc => doc.data().q1 || ""));
        }, (err) => {
          setStatus({ type: "error", text: "讀取資料失敗：" + err.message });
        });

        return () => unsubscribe();
      }, [user]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!input.trim()) return;

        setIsSubmitting(true);
        setStatus({ type: "", text: "" });

        try {
          await addDoc(collection(db, 'artifacts', finalAppId, 'public', 'data', 'responses'), {
            q1: input.trim(),
            timestamp: serverTimestamp()
          });
          setInput("");
          setStatus({ type: "success", text: "送出成功！文字雲已更新。" });
          setTimeout(() => setStatus({ type: "", text: "" }), 3000);
        } catch (err) {
          setStatus({ type: "error", text: "送出失敗：" + err.message });
        } finally {
          setIsSubmitting(false);
        }
      };

      if (loading && !status.text.includes("驗證失敗")) {
        return (
          <div className="flex justify-center p-20">
            <svg className="w-10 h-10 text-emerald-500 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path d="M21 12a9 9 0 1 1-6.219-8.56" />
            </svg>
          </div>
        );
      }

      return (
        <div className="max-w-3xl mx-auto p-6 space-y-6">
          <header className="text-center mb-6">
            <h1 className="text-3xl font-bold text-emerald-700">環保杯互動文字雲測試</h1>
            <p className="text-slate-600 mt-2">請輸入你裝過的飲料種類</p>
          </header>

          <form onSubmit={handleSubmit} className="flex gap-4">
            <input
              type="text"
              placeholder="例：熱美式、抹茶"
              className="flex-grow p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-400"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              disabled={isSubmitting}
            />
            <button
              type="submit"
              disabled={isSubmitting || !input.trim()}
              className={`px-6 py-3 rounded-lg font-bold text-white transition ${
                isSubmitting ? "bg-slate-400" : "bg-emerald-600 hover:bg-emerald-700"
              }`}
            >
              {isSubmitting ? "送出中…" : "送出"}
            </button>
          </form>

          {status.text && (
            <div
              className={`p-3 rounded text-center text-sm ${
                status.type === "success" ? "bg-green-100 text-green-700" : "bg-red-100 text-red-700"
              }`}
            >
              {status.text}
            </div>
          )}

          <section>
            <h2 className="text-xl font-bold text-emerald-700 mb-4 text-center">大家裝過的飲料</h2>
            <WordCloudDisplay data={responses} />
          </section>
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
