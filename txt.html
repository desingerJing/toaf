<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>環保杯互動文字雲</title>
    
    <!-- 1. 引入 Tailwind CSS (樣式庫) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 引入 React 和 Babel (核心框架) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 設定 Tailwind 字型 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50">

    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // =========================================================================
        // !!! 重要：請在此處填入您從 Firebase 控制台取得的 Config !!!
        // =========================================================================
        const myFirebaseConfig = {
            apiKey: "您的API_KEY",
            authDomain: "您的專案ID.firebaseapp.com",
            projectId: "您的專案ID",
            storageBucket: "您的專案ID.firebasestorage.app",
            messagingSenderId: "您的ID",
            appId: "您的APP_ID"
        };

        // --- 初始化邏輯 ---
        let app, auth, db;
        const configToUse = (typeof __firebase_config !== 'undefined') ? JSON.parse(__firebase_config) : myFirebaseConfig;
        const finalAppId = (typeof __app_id !== 'undefined') ? __app_id : 'eco-cloud-app';

        try {
            app = initializeApp(configToUse);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (error) {
            console.error("Firebase Init Error", error);
        }

        // --- 圖示 (SVG) ---
        const Cloud = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17.5 19c0-1.7-1.3-3-3-3h-1.1c-.1-2.9-2.4-5.2-5.3-5.2-2.3 0-4.3 1.5-5 3.7C1.3 15.6 2.4 17.5 4.6 17.5H6"/></svg>;
        const Leaf = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>;
        const Coffee = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></svg>;
        const ThumbsUp = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2h0a3.13 3.13 0 0 1 3 3.88Z"/></svg>;
        const Send = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>;
        const Loader2 = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className + " animate-spin"}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>;

        const WordCloudDisplay = ({ data, colorTheme = "green" }) => {
            const frequencyMap = React.useMemo(() => {
                const map = {};
                data.forEach(text => {
                    const clean = text?.trim();
                    if (clean) map[clean] = (map[clean] || 0) + 1;
                });
                return map;
            }, [data]);

            const tags = React.useMemo(() => {
                const list = Object.entries(frequencyMap).map(([text, count]) => ({ text, count }));
                const counts = list.map(t => t.count);
                const max = Math.max(...counts, 1);
                const min = Math.min(...counts, 1);
                
                return list.map(item => {
                    const size = max === min ? 1.5 : 1 + ((item.count - min) / (max - min)) * 2.5;
                    return { ...item, size: `${size}rem`, opacity: 0.6 + (Math.min(item.count, 10) * 0.04) };
                }).sort(() => Math.random() - 0.5);
            }, [frequencyMap]);

            if (tags.length === 0) return (
                <div className="h-64 flex flex-col items-center justify-center text-slate-400 border-2 border-dashed border-slate-200 rounded-xl bg-slate-50/50">
                    <Cloud className="w-12 h-12 mb-2 opacity-50" />
                    <p>目前還沒有答案，快來填寫！</p>
                </div>
            );

            const colors = colorTheme === 'blue' ? 
                ['text-sky-600', 'text-blue-600', 'text-indigo-600'] : 
                ['text-emerald-600', 'text-teal-600', 'text-green-600'];

            return (
                <div className="flex flex-wrap justify-center items-center gap-x-6 gap-y-3 p-6 bg-white rounded-xl shadow-inner min-h-[16rem]">
                    {tags.map((tag, i) => (
                        <span key={tag.text} className={`transition-all font-bold hover:scale-110 ${colors[i % colors.length]}`} 
                              style={{ fontSize: tag.size, opacity: tag.opacity }}>
                            {tag.text}
                        </span>
                    ))}
                </div>
            );
        };

        function App() {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [responses, setResponses] = React.useState([]);
            const [input1, setInput1] = React.useState('');
            const [input2, setInput2] = React.useState('');
            const [status, setStatus] = React.useState({ type: '', text: '' });
            const [isSubmitting, setIsSubmitting] = React.useState(false);

            React.useEffect(() => {
                const unsubscribeAuth = onAuthStateChanged(auth, async (u) => {
                    if (!u) {
                        try {
                            await signInAnonymously(auth);
                        } catch (err) {
                            setStatus({ type: 'error', text: '驗證失敗：' + err.message });
                        }
                    } else {
                        setUser(u);
                        setLoading(false);
                    }
                });
                return () => unsubscribeAuth();
            }, []);

            React.useEffect(() => {
                if (!user) return;
                const collRef = collection(db, 'artifacts', finalAppId, 'public', 'data', 'responses');
                const unsubscribe = onSnapshot(collRef, (snap) => {
                    setResponses(snap.docs.map(d => d.data()));
                }, (err) => {
                    setStatus({ type: 'error', text: '讀取資料失敗：' + err.message });
                });
                return () => unsubscribe();
            }, [user]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!input1.trim() && !input2.trim()) return;
                setIsSubmitting(true);
                setStatus({ type: '', text: '' });

                try {
                    await addDoc(collection(db, 'artifacts', finalAppId, 'public', 'data', 'responses'), {
                        q1: input1.trim(),
                        q2: input2.trim(),
                        timestamp: serverTimestamp()
                    });
                    setInput1('');
                    setInput2('');
                    setStatus({ type: 'success', text: '送出成功！文字雲已更新。' });
                    setTimeout(() => setStatus({ type: '', text: '' }), 3000);
                } catch (err) {
                    setStatus({ type: 'error', text: '送出失敗：' + err.message });
                } finally {
                    setIsSubmitting(false);
                }
            };

            if (loading && !status.text.includes('驗證失敗')) return <div className="flex justify-center p-20"><Loader2 className="w-10 h-10 text-emerald-500" /></div>;

            return (
                <div className="max-w-4xl mx-auto p-4 md:p-8 space-y-8">
                    <header className="text-center">
                        <Leaf className="w-10 h-10 text-emerald-500 mx-auto mb-2" />
                        <h1 className="text-3xl font-bold text-slate-800">環保杯互動調查</h1>
                    </header>

                    <div className="bg-white p-6 rounded-2xl shadow-lg border border-emerald-50">
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div className="grid md:grid-cols-2 gap-6">
                                <div className="space-y-2">
                                    <label className="font-bold text-slate-700 flex items-center gap-2"><Coffee className="w-4 h-4" /> 你的環保杯裝過什麼？</label>
                                    <input type="text" value={input1} onChange={e => setInput1(e.target.value)} placeholder="如：熱美式、抹茶" className="w-full p-3 bg-slate-50 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-400" />
                                </div>
                                <div className="space-y-2">
                                    <label className="font-bold text-slate-700 flex items-center gap-2"><ThumbsUp className="w-4 h-4" /> 環保杯不離身是習慣嗎？</label>
                                    <input type="text" value={input2} onChange={e => setInput2(e.target.value)} placeholder="如：每天、偶爾、努力中" className="w-full p-3 bg-slate-50 border rounded-lg outline-none focus:ring-2 focus:ring-blue-400" />
                                </div>
                            </div>
                            <button type="submit" disabled={isSubmitting} className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 disabled:bg-slate-300 transition-all flex justify-center items-center gap-2">
                                {isSubmitting ? <Loader2 className="w-5 h-5" /> : <><Send className="w-5 h-5" /> 送出答案</>}
                            </button>
                            {status.text && (
                                <div className={`p-3 rounded text-center text-sm ${status.type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                    {status.text}
                                </div>
                            )}
                        </form>
                    </div>

                    <div className="grid md:grid-cols-2 gap-8">
                        <section className="space-y-3">
                            <h3 className="font-bold text-emerald-700 text-center">大家裝了什麼？</h3>
                            <WordCloudDisplay data={responses.map(r => r.q1)} colorTheme="green" />
                        </section>
                        <section className="space-y-3">
                            <h3 className="font-bold text-blue-700 text-center">大家的攜帶習慣</h3>
                            <WordCloudDisplay data={responses.map(r => r.q2)} colorTheme="blue" />
                        </section>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
